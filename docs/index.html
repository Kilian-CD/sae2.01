<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SAE 2.01</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  </head>
  <body>
    <script>
      (async function () {
        await cheerpjInit({version: 11});
        cheerpjCreateDisplay(1920, 1080);
        let currentPath = window.location.pathname;
        if (!currentPath.endsWith('/')) {
          currentPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
        }
        const jarPath = `/app${currentPath}sae-fete-lumiere.jar`;
        await cheerpjRunJar(jarPath);
      })();
    </script>
  </body>
</html>
